services:
  # ── Qdrant vector database ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: rag_qdrant
    ports:
      - "6333:6333"   # REST API (exposed so you can still use the Qdrant dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_backend
    ports:
      - "8000:8000"   # Exposed so you can still hit the API directly / Swagger UI
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      GROQ_API_KEY: ${GROQ_API_KEY}
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data   # Mount data dir so indexed docs persist across restarts

  # ── React frontend (Nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # /api is the Nginx proxy path → backend:8000
        VITE_API_URL: /api
    container_name: rag_frontend
    ports:
      - "80:80"       # Open http://localhost in your browser
    depends_on:
      - backend

volumes:
  qdrant_storage:
