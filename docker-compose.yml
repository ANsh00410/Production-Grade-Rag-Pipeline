version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: rag_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: rag_api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  qdrant_storage:
